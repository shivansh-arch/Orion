services:
  frontend:
    build: ./orion-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend

  backend:
    build: ./orion-backend-node
    ports:
      - "5000:5000"
    env_file:
      - ./orion-backend-node/.env
    environment:
      ORION_BACKEND_URL: http://core:8000
    depends_on:
      - core

  core:
    build: ./orion-core
    ports:
      - "8000:8000"
    env_file:
      - ./orion-core/.env
    environment:
      PORT: 8000